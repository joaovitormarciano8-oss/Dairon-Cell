<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Como chegar na Dairon Cell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/*
  ANÚNCIO "COMO CHEGAR" — 1920x1080, 20 s
  Troque os dados pela URL, sem mexer no código:
    ?nome=Dairon%20Cell&tipo=Loja&endereco=...&rua1=Rua%20X&rua2=Avenida%20Y
  Outros parâmetros: ?mb=16 (sub-quadros de motion blur), ?t=12.8 (abre parado nesse segundo)
*/
:root{
  --ink:#202124; --ink-2:#5f6368; --line:#dadce0; --paper:#ffffff;
  --blue:#1a73e8; --blue-d:#0b57d0; --red:#ea4335; --green:#188038; --stage-bg:#0b0c0e;
  --font:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--stage-bg);overflow:hidden;font-family:var(--font);color:var(--ink)}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#f3f4f6}
#gl{position:absolute;inset:0;width:1920px;height:1080px;display:block}
.ov{position:absolute;will-change:transform,opacity;pointer-events:none}

/* Logo -> pin */
#logo{left:0;top:0;width:1920px;height:1080px}
#logo svg{position:absolute;left:50%;top:50%;margin:-150px 0 0 -150px;overflow:visible}

/* Barra de busca */
#search{left:48px;top:44px;width:660px;height:76px;border-radius:38px;background:var(--paper);
  box-shadow:0 2px 6px rgba(60,64,67,.25),0 6px 20px rgba(60,64,67,.15);display:flex;align-items:center;gap:22px;padding:0 30px;font-size:30px;color:var(--ink)}
#search svg{width:34px;height:34px;flex:none}
#search .q{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Card do lugar */
#card{left:48px;bottom:48px;width:760px;border-radius:28px;background:var(--paper);padding:34px 40px 36px;
  box-shadow:0 4px 12px rgba(60,64,67,.25),0 18px 48px rgba(60,64,67,.22)}
#card .name{font-size:52px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
#card .type{margin-top:10px;font-size:28px;color:var(--ink-2)}
#card .addr{margin-top:18px;font-size:26px;color:var(--ink);display:flex;gap:14px;align-items:flex-start;line-height:1.35}
#card .addr svg{width:30px;height:30px;flex:none;margin-top:2px}
#card .btns{margin-top:30px;display:flex;gap:18px}
.pill{display:inline-flex;align-items:center;gap:14px;height:70px;padding:0 34px;border-radius:35px;font-size:28px;font-weight:500;position:relative;overflow:hidden}
.pill svg{width:32px;height:32px}
.pill--blue{background:var(--blue);color:#fff}
.pill--ghost{border:2px solid var(--line);color:var(--blue)}
#ripple{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(255,255,255,.45)}

/* Banner de navegação */
#nav{left:48px;top:44px;width:900px;border-radius:26px;background:var(--green);color:#fff;display:flex;align-items:center;gap:30px;padding:26px 36px;
  box-shadow:0 6px 24px rgba(0,0,0,.25)}
#nav .arrow{width:84px;height:84px;flex:none}
#nav .small{font-size:26px;opacity:.85}
#nav .street{font-size:46px;font-weight:700;line-height:1.1;margin-top:4px}
#nav .slot{position:relative;flex:1;height:104px}
#nav .row{position:absolute;inset:0;display:flex;align-items:center;gap:30px}

/* Etiquetas das ruas no mapa */
.label{left:0;top:0;padding:10px 22px;border-radius:12px;background:#fff;font-size:26px;font-weight:500;color:var(--ink);
  white-space:nowrap;box-shadow:0 2px 8px rgba(60,64,67,.3);display:flex;align-items:center;gap:10px}
.label i{width:12px;height:12px;border-radius:50%;background:var(--blue);display:block}

/* Chegada */
#arrived{left:50%;bottom:56px;width:820px;margin-left:-410px;border-radius:30px;background:var(--paper);padding:30px 40px;display:flex;gap:30px;align-items:center;
  box-shadow:0 6px 30px rgba(60,64,67,.3)}
#arrived .chk{width:96px;height:96px;flex:none}
#arrived .big{font-size:54px;font-weight:900;letter-spacing:-.5px}
#arrived .sub{font-size:26px;color:var(--ink-2);margin-top:6px}

/* Cartão final */
#veil{inset:0;background:rgba(255,255,255,.55)}
#final{left:50%;top:50%;width:1060px;margin-left:-530px;border-radius:40px;background:var(--paper);padding:64px 72px;text-align:center;
  box-shadow:0 10px 40px rgba(60,64,67,.28),0 40px 120px rgba(60,64,67,.25)}
#final .pinbig{width:110px;height:150px;margin:0 auto 18px;display:block}
#final .name{font-size:96px;font-weight:900;letter-spacing:-2px;line-height:1}
#final .type{font-size:34px;color:var(--ink-2);margin-top:16px}
#final .addr{font-size:32px;margin-top:30px;line-height:1.35}
#final .cta{margin-top:40px;display:inline-flex}
#final .cta .pill{height:84px;font-size:34px;padding:0 46px;border-radius:42px}

/* Controles (fora do vídeo) */
#start,#again{position:fixed;inset:0;display:grid;place-items:center;background:rgba(11,12,14,.55);z-index:5}
#start[hidden],#again[hidden]{display:none}
.play{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;background:#fff;color:#202124;font:500 20px var(--font);padding:18px 30px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.play:focus-visible{outline:3px solid #8ab4f8;outline-offset:4px}
.play svg{width:26px;height:26px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="gl" width="1920" height="1080"></canvas>

    <div class="ov" id="logo">
      <svg id="logoSvg" width="300" height="300" viewBox="-150 -150 300 300" aria-hidden="true">
        <defs>
          <clipPath id="sq"><rect x="-120" y="-120" width="240" height="240" rx="56"/></clipPath>
          <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3c4043" flood-opacity=".28"/></filter>
        </defs>
        <g id="tile" filter="url(#sh)">
          <rect x="-120" y="-120" width="240" height="240" rx="56" fill="#fff"/>
          <g clip-path="url(#sq)">
            <rect x="-120" y="-120" width="240" height="240" fill="#e8f0fe"/>
            <path d="M-120 40 L120 -40" stroke="#fff" stroke-width="34"/>
            <path d="M-20 -120 L30 120" stroke="#fff" stroke-width="26"/>
            <rect x="40" y="10" width="90" height="120" fill="#ceead6"/>
            <path d="M-120 -70 Q -40 -60 10 -10 T 130 60" stroke="#fbbc04" stroke-width="12" fill="none"/>
          </g>
        </g>
        <g id="pin2d">
          <path d="M0 64 C -10 40 -48 6 -48 -26 A48 48 0 1 1 48 -26 C48 6 10 40 0 64 Z" fill="#ea4335"/>
          <circle cx="0" cy="-26" r="17" fill="#a50e0e"/>
        </g>
      </svg>
    </div>

    <div class="ov" id="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>
      <span class="q" data-cfg="nome"></span>
      <svg viewBox="0 0 24 24" fill="#ea4335"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
    </div>

    <div class="ov" id="card">
      <div class="name" data-cfg="nome"></div>
      <div class="type" data-cfg="tipo"></div>
      <div class="addr">
        <svg viewBox="0 0 24 24" fill="#1a73e8"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span data-cfg="endereco"></span>
      </div>
      <div class="btns">
        <span class="pill pill--blue" id="goBtn">
          <svg viewBox="0 0 24 24" fill="#fff"><path d="M21.7 11.3 12.7 2.3a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4zM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5z"/></svg>
          Como chegar<span id="ripple"></span>
        </span>
        <span class="pill pill--ghost">
          <svg viewBox="0 0 24 24" fill="#1a73e8"><path d="M12 2 4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg>
          Iniciar
        </span>
      </div>
    </div>

    <div class="ov" id="nav">
      <div class="slot">
        <div class="row" id="nav1">
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M6 10l6-6 6 6"/></svg>
          <div><div class="small">Siga pela</div><div class="street" data-cfg="rua1"></div></div>
        </div>
        <div class="row" id="nav2">
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-8a3 3 0 0 0-3-3H5M9 5 5 9l4 4"/></svg>
          <div><div class="small">Vire à esquerda na</div><div class="street" data-cfg="rua2"></div></div>
        </div>
      </div>
    </div>

    <div class="ov label" id="lab1"><i></i><span data-cfg="rua1"></span></div>
    <div class="ov label" id="lab2"><i></i><span data-cfg="rua2"></span></div>
    <div class="ov label" id="labStart"><i style="background:#1a73e8"></i>Você está aqui</div>

    <div class="ov" id="arrived">
      <svg class="chk" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#188038"/><path d="m14 24.5 7 7 13-14" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><div class="big">Você chegou!</div><div class="sub"><span data-cfg="nome"></span> · <span data-cfg="endereco"></span></div></div>
    </div>

    <div class="ov" id="veil"></div>
    <div class="ov" id="final">
      <svg class="pinbig" viewBox="-50 -76 100 146"><path d="M0 64 C -10 40 -48 6 -48 -26 A48 48 0 1 1 48 -26 C48 6 10 40 0 64 Z" fill="#ea4335"/><circle cx="0" cy="-26" r="17" fill="#a50e0e"/></svg>
      <div class="name" data-cfg="nome"></div>
      <div class="type" data-cfg="tipo"></div>
      <div class="addr" data-cfg="endereco"></div>
      <div class="cta"><span class="pill pill--blue">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M21.7 11.3 12.7 2.3a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4zM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5z"/></svg>
        Venha nos visitar</span></div>
    </div>
  </div>
</div>

<div id="start"><button class="play" id="playBtn" type="button">
  <svg viewBox="0 0 24 24" fill="#1a73e8"><path d="M8 5v14l11-7z"/></svg> Reproduzir com som</button></div>
<div id="again" hidden><button class="play" id="againBtn" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg> Assistir de novo</button></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
"use strict";
/* ================= CONFIGURAÇÃO ================= */
var qs = new URLSearchParams(location.search);
var CFG = {
  nome:     qs.get("nome")     || "Dairon Cell",
  tipo:     qs.get("tipo")     || "Loja de tecnologia Apple",
  endereco: qs.get("endereco") || "Praça Getúlio Vargas - Centro, Caratinga - MG",
  rua1:     qs.get("rua1")     || "Avenida Olegário Maciel",
  rua2:     qs.get("rua2")     || "Avenida Benedito Valadares"
};
var DUR = 20, W = 1920, H = 1080;
var SAMPLES = Math.max(1, Math.min(32, parseInt(qs.get("mb"), 10) || 16));
var FIXED_SAMPLES = qs.has("mb");
var SHUTTER = 1 / 30;              // intervalo coberto pelos sub-quadros de cada frame

document.querySelectorAll("[data-cfg]").forEach(function(el){ el.textContent = CFG[el.dataset.cfg]; });

/* ================= UTILITÁRIOS ================= */
function clamp(x,a,b){ return Math.min(b, Math.max(a, x)); }
function lin(t,a,b){ return clamp((t-a)/(b-a),0,1); }
function sstep(t,a,b){ var x=lin(t,a,b); return x*x*(3-2*x); }
function smoother(x){ return x*x*x*(x*(x*6-15)+10); }
function sm2(t,a,b){ return smoother(lin(t,a,b)); }
function easeOutBack(x){ var c=1.70158, c3=c+1; return 1 + c3*Math.pow(x-1,3) + c*Math.pow(x-1,2); }
function easeOutCubic(x){ return 1-Math.pow(1-x,3); }
function lerp(a,b,x){ return a+(b-a)*x; }
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
var R = rng(20261127);

/* ================= RENDERER / CENA ================= */
var canvas = document.getElementById("gl");
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, preserveDrawingBuffer: true, powerPreference: "high-performance" });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // a cidade é estática: sombra calculada uma vez
renderer.shadowMap.needsUpdate = true;

var FOG = new THREE.Color(0xf3f4f6);
var scene = new THREE.Scene();
scene.background = FOG.clone();
scene.fog = new THREE.Fog(FOG, 300, 1500);

var camera = new THREE.PerspectiveCamera(38, W/H, 0.5, 4000);

scene.add(new THREE.HemisphereLight(0xffffff, 0xc9d1d9, 1.25));
var sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(260, 420, 180);
sun.target.position.set(0,0,0);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
var sc = sun.shadow.camera; sc.left=-430; sc.right=430; sc.top=430; sc.bottom=-430; sc.near=50; sc.far=1400;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.4;
scene.add(sun); scene.add(sun.target);

/* ================= CIDADE PROCEDURAL ================= */
var P = 52, BLK = 40, NB = 6;                       // passo da quadra, tamanho, quadras para cada lado
var ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshLambertMaterial({ color: 0xfbfbfc }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ruas principais com tom amarelado (estilo mapa)
function strip(x, z, w, d, color){
  var m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshLambertMaterial({ color: color }));
  m.rotation.x = -Math.PI/2; m.position.set(x, 0.04, z); m.receiveShadow = true; scene.add(m);
}
var ROAD1_Z = 0.5*P, ROAD2_X = 2.5*P;
strip(0, ROAD1_Z, 2*(NB+1)*P, 11, 0xfdf1c5);
strip(ROAD2_X, 0, 11, 2*(NB+1)*P, 0xfdf1c5);

var DEST_BLOCK = [2,-2], PARK_FACADE = [3,-2];
function isPark(i,j){
  if (i===PARK_FACADE[0] && j===PARK_FACADE[1]) return true;
  return (i===-2 && j===2) || (i===-4 && j===-3) || (i===4 && j===3) || (i===0 && j===-5);
}
var slabs = [], parks = [], bld = [], trees = [];
for (var i=-NB;i<=NB;i++) for (var j=-NB;j<=NB;j++){
  var cx=i*P, cz=j*P;
  if (isPark(i,j)) {
    parks.push([cx,cz]);
    var nt = 14 + (R()*8|0);
    for (var k=0;k<nt;k++){
      var tx = cx + (R()-.5)*34, tz = cz + (R()-.5)*34;
      if (i===PARK_FACADE[0] && j===PARK_FACADE[1]) continue; // praça aberta: deixa a fachada à vista
      trees.push([tx, tz, 4+R()*4]);
    }
    continue;
  }
  slabs.push([cx,cz]);
  var dc = Math.hypot(cx, cz) / (NB*P);
  if (i===DEST_BLOCK[0] && j===DEST_BLOCK[1]) {
    bld.push([cx-9, cz-9, 16, 16, 12]); bld.push([cx-9, cz+9, 16, 16, 9]);
    continue;
  }
  var split = R();
  var lots = split < .25 ? [[0,0,36,36]] : split < .6 ? [[-9,0,17,36],[9,0,17,36]] : [[-9,-9,17,17],[9,-9,17,17],[-9,9,17,17],[9,9,17,17]];
  lots.forEach(function(L){
    var tall = R() < (0.22 - dc*0.15);
    var h = tall ? 34 + R()*46 : 6 + R()*20*(1.1-dc*.5);
    var onRoute = ((j===0 || j===1) && i>=-4 && i<=3) || ((i===2 || i===3) && j<=1 && j>=-3);
    if (onRoute) h = Math.min(h, 7 + R()*7);   // prédios baixos ao longo da rota, para ela ficar visível
    var w = L[2] - 2 - R()*3, d = L[3] - 2 - R()*3;
    bld.push([cx+L[0], cz+L[1], w, d, h]);
  });
}

function boxGeo(){
  var g = new THREE.BoxGeometry(1,1,1); g.translate(0,.5,0);
  var pos = g.attributes.position, col = [];
  for (var v=0; v<pos.count; v++){ var y = pos.getY(v); var c = 0.80 + 0.20*y; col.push(c,c,c); }
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  return g;
}
var M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(), Pv = new THREE.Vector3();
function instanced(geo, mat, list, fn){
  var m = new THREE.InstancedMesh(geo, mat, list.length);
  list.forEach(function(it, k){ fn(it, Pv, S); M4.compose(Pv, Q, S); m.setMatrixAt(k, M4); });
  m.instanceMatrix.needsUpdate = true; return m;
}
var slabMesh = instanced(new THREE.BoxGeometry(1,1,1).translate(0,.5,0), new THREE.MeshLambertMaterial({ color: 0xeceef1 }), slabs,
  function(b,p,s){ p.set(b[0],0,b[1]); s.set(BLK,.5,BLK); });
slabMesh.receiveShadow = true; scene.add(slabMesh);
var parkMesh = instanced(new THREE.BoxGeometry(1,1,1).translate(0,.5,0), new THREE.MeshLambertMaterial({ color: 0xcdeac8 }), parks,
  function(b,p,s){ p.set(b[0],0,b[1]); s.set(BLK,.45,BLK); });
parkMesh.receiveShadow = true; scene.add(parkMesh);
var bMesh = instanced(boxGeo(), new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true }), bld,
  function(b,p,s){ p.set(b[0],.5,b[1]); s.set(b[2],b[4],b[3]); });
bMesh.castShadow = true; bMesh.receiveShadow = true; scene.add(bMesh);
var treeMesh = instanced(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshLambertMaterial({ color: 0x9ccc65, flatShading: true }), trees,
  function(t,p,s){ p.set(t[0], t[2]*0.9, t[1]); s.set(t[2]*.75, t[2], t[2]*.75); });
treeMesh.castShadow = true; scene.add(treeMesh);

/* ================= LUGAR DE DESTINO (fachada) ================= */
var DEST_W = 26, DEST_D = 20, DEST_H = 20;
var destX = DEST_BLOCK[0]*P + BLK/2 - DEST_D/2 - 1.5, destZ = DEST_BLOCK[1]*P;
function facadeTexture(){
  var c = document.createElement("canvas"); c.width = 1024; c.height = 768;
  var g = c.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0,0,1024,768);
  g.fillStyle = "#f1f3f4"; g.fillRect(0,0,1024,300);
  for (var w=0; w<4; w++){ g.fillStyle = "#cfd8e3"; g.fillRect(70 + w*235, 60, 180, 150); }
  g.fillStyle = "#202124"; g.fillRect(0, 300, 1024, 18);
  g.fillStyle = "#ffffff"; g.fillRect(0, 318, 1024, 150);
  var fs = 96; g.font = "900 " + fs + "px Roboto, Arial, sans-serif";
  while (g.measureText(CFG.nome).width > 900 && fs > 30){ fs -= 4; g.font = "900 " + fs + "px Roboto, Arial, sans-serif"; }
  g.fillStyle = "#202124"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(CFG.nome, 512, 395);
  var gr = g.createLinearGradient(0, 468, 0, 768); gr.addColorStop(0, "#2b3036"); gr.addColorStop(1, "#14171a");
  g.fillStyle = gr; g.fillRect(40, 468, 944, 300);
  g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(40, 468, 944, 40);
  for (var s=0; s<7; s++){ g.fillStyle = s%2 ? "#ff7a35" : "#e8eaed"; g.fillRect(110 + s*120, 560 + (s%3)*30, 60, 90); }
  g.fillStyle = "#ffffff"; g.fillRect(500, 468, 12, 300);
  var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
var white = new THREE.MeshLambertMaterial({ color: 0xffffff });
var front = new THREE.MeshLambertMaterial({ map: null });

  fragmentShader: "uniform sampler2D tex; uniform float w; varying vec2 vUv; void main(){ gl_FragColor = vec4(texture2D(tex, vUv).rgb * w, 1.); }",
  blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, transparent: true

  fragmentShader: [
    "uniform sampler2D tex; varying vec2 vUv;",

    "void main(){ vec3 c = texture2D(tex, vUv).rgb;",

  renderer.autoClear = false;
  renderer.setRenderTarget(rtAcc); renderer.setClearColor(0x000000, 1); renderer.clear(true, false, false);
  var n = SAMPLES;
  for (var s = 0; s < n; s++){
    var ts = n === 1 ? t : t - SHUTTER * (1 - (s + .5) / n);
    setTime(Math.max(0, ts));
    renderer.setRenderTarget(rtSub); renderer.setClearColor(FOG, 1); renderer.clear(true, true, false);
    renderer.render(scene, camera);
    if (s === 0 && renderer.shadowMap.needsUpdate === false) {} // sombra já pronta

    renderer.setRenderTarget(rtAcc); renderer.render(accScene, quadCam);

}

  el.pin2d.style.opacity = (1 - sstep(t, 1.15, 1.45)).toFixed(3);

  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(amp || .55, hit); g.gain.exponentialRampToValueAtTime(0.0001, at + len);

function scoreAt(t0){
  var BEAT = 0.5;  // 120 BPM
  var chords = [ [220, 261.63, 329.63], [174.61, 220, 261.63], [130.81, 164.81, 196], [196, 246.94, 293.66] ]; // Am F C G
  var roots = [55, 43.65, 65.41, 49];
  riser(t0, 1.0);
  [1.0, 3.0, 4.3, 5.5, 12.8, 15.0, 17.7].forEach(function(h, k){ whoosh(t0 + h, k === 0 ? 1.0 : .9, k === 0 ? .6 : .5); });

    if (b % 4 === 0 && bt >= 1.0) pad(at, chords[bar], 2.0, bt >= 15 ? .07 : .045);
  }
  kick(t0 + 1.0, 1.0);
  click(t0 + 3.9);

  kick(t0 + 17.7, 1.0); pad(t0 + 17.7, [220, 277.18, 329.63, 440], 2.3, .08);

}

var playing = false, t0Audio = 0, t0Perf = 0, slow = 0;
function now(){ return (performance.now() - t0Perf) / 1000; }
function start(){
  $("start").hidden = true; $("again").hidden = true;
  if (!actx) audioInit();
  if (actx){ actx.resume(); t0Audio = actx.currentTime + 0.15; scoreAt(t0Audio); }
  t0Perf = performance.now() + 150;
  playing = true; requestAnimationFrame(loop);
}
function loop(){
  if (!playing) return;
  var t = now();
  if (t >= DUR){ renderFrame(DUR - 1e-3); playing = false; $("again").hidden = false; return; }
  var a = performance.now();
  renderFrame(Math.max(0, t));
  var ms = performance.now() - a;
  if (!FIXED_SAMPLES && SAMPLES > 4){ slow = ms > 66 ? slow + 1 : Math.max(0, slow - 1); if (slow > 20){ SAMPLES = SAMPLES/2|0; slow = 0; } }
  requestAnimationFrame(loop);
}
$("playBtn").addEventListener("click", start);
$("againBtn").addEventListener("click", start);
document.addEventListener("keydown", function(e){ if (e.key === " " && !playing){ e.preventDefault(); start(); } });

function fit(){
  var s = Math.min(innerWidth / W, innerHeight / H);
  $("stage").style.transform = "scale(" + s + ") translate(-50%,-50%)";
}
addEventListener("resize", fit); fit();

window.renderAt = function(t){ renderFrame(t); };
function boot(){
  applyFacade();
  var tq = parseFloat(qs.get("t"));
  renderFrame(isFinite(tq) ? clamp(tq, 0, DUR) : 0.0);
  if (isFinite(tq)) $("start").hidden = true;
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
})();
</script>
</body>
